# Demonstration deployment: load the locally built image or replace with your
# registry image pinned by digest. Create policy ConfigMap and token Secret first.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tool-gateway-audit
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-gateway
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: tool-gateway
  template:
    metadata:
      labels:
        app: tool-gateway
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 20
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: tool-gateway:local
          imagePullPolicy: Never
          args: [serve, --policy, /etc/tool-gateway/policy.json]
          ports:
            - name: http
              containerPort: 8844
          env:
            - name: TOOL_GATEWAY_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tool-gateway-token
                  key: token
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: '1'
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: policy
              mountPath: /etc/tool-gateway
              readOnly: true
            - name: audit
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: policy
          configMap:
            name: tool-gateway-policy
        - name: audit
          persistentVolumeClaim:
            claimName: tool-gateway-audit
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 32Mi
---
apiVersion: v1
kind: Service
metadata:
  name: tool-gateway
spec:
  selector:
    app: tool-gateway
  ports:
    - name: http
      port: 8844
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tool-gateway-restrict
spec:
  podSelector:
    matchLabels:
      app: tool-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              tool-gateway-client: 'true'
      ports:
        - protocol: TCP
          port: 8844
  # The demo has no network dependency. Add exact reviewed egress rules for
  # actual remote upstreams and DNS, rather than allowing all destinations.
  egress: []
